# Podgląd strony na GitHub Pages (ukryty przed Google: noindex + robots Disallow). Produkcja to spondylus.pl.
name: Podgląd na GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  podglad:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.wdrozenie.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python3 build.py --podglad /spondylus
      - run: python3 narzedzia/kontrola_seo.py || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: wdrozenie
        uses: actions/deploy-pages@v4
